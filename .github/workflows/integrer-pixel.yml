name: Integrer Pixel sur les deux pages
on:
  push:
    branches: [main]
    paths:
      - 'assets/pixel-guide.js'
      - 'assets/pixel-guide.css'
      - 'assets/atelier-bd.css'
      - 'assets/atelier-pixel.js'
      - 'assets/darksathi-li.js'
      - 'assets/darksathi-li.css'
      - 'assets/typographie-correctif.css'
      - 'assets/metiers-missions.js'
      - 'assets/metiers-missions.css'
      - 'assets/darksathi-sprites.css'
      - 'assets/darksathi-sprites.js'
      - 'assets/personnages/darksathi-li-spritesheet.png'
      - 'outils/integrer_pixel.py'
      - '.github/workflows/integrer-pixel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python outils/integrer_pixel.py
      - name: Verifier les deux pages
        run: |
          grep -q 'assets/darksathi-li.js' index.html
          grep -q 'assets/darksathi-li.js' atelier-original.html
          grep -q 'assets/atelier-bd.css' atelier-original.html
      - name: Publier sur main
        run: |
          if ! git diff --quiet -- index.html atelier-original.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html atelier-original.html
            git commit -m 'Appliquer le style BD et Pixel aux deux pages'
            git push
          fi
